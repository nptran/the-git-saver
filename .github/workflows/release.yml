name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      # =========================================================
      # Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_TOKEN }}

      # =========================================================
      # Fetch tags explicitly
      # =========================================================
      - name: Fetch all tags
        shell: pwsh
        run: |
          git fetch --force --tags

      # =========================================================
      # Setup Python
      # =========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================================================
      # Cache pip
      # =========================================================
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      # =========================================================
      # Install dependencies
      # =========================================================
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

          pip install -r requirements.txt

          pip install pyinstaller
          pip install python-semantic-release

      # =========================================================
      # Run semantic release
      # =========================================================
      - name: Run semantic release
        id: semantic_release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: pwsh
        run: |
          $output = semantic-release version | Out-String

          Write-Host $output

          if ($output -match 'The next version is: ([0-9]+\.[0-9]+\.[0-9]+)') {

            $version = $matches[1]

            echo "released=true" >> $env:GITHUB_OUTPUT
            echo "version=$version" >> $env:GITHUB_OUTPUT
            echo "tag=ver$version" >> $env:GITHUB_OUTPUT

            Write-Host "Release version: $version"
          }
          else {

            echo "released=false" >> $env:GITHUB_OUTPUT

            Write-Host "No release generated"
          }

      # =========================================================
      # Build executable
      # =========================================================
      - name: Build executable
        if: steps.semantic_release.outputs.released == 'true'
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --clean `
            --noconfirm `
            --add-data "config;config" `
            --name rebase-overlord `
            git_feature_flow.py

      # =========================================================
      # Rename EXE
      # =========================================================
      - name: Rename executable
        if: steps.semantic_release.outputs.released == 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.semantic_release.outputs.version }}"

          $newName = "rebase-overlord-$version.exe"

          Rename-Item `
            -Path "dist\rebase-overlord.exe" `
            -NewName $newName

          Write-Host "Renamed EXE to: $newName"

      # =========================================================
      # Upload workflow artifact
      # =========================================================
      - name: Upload workflow artifact
        if: steps.semantic_release.outputs.released == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rebase-overlord-${{ steps.semantic_release.outputs.version }}
          path: |
            dist/rebase-overlord-${{ steps.semantic_release.outputs.version }}.exe

      # =========================================================
      # Upload EXE to GitHub Release
      # =========================================================
      - name: Upload EXE to GitHub Release
        if: steps.semantic_release.outputs.released == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semantic_release.outputs.tag }}
          files: |
            dist/rebase-overlord-${{ steps.semantic_release.outputs.version }}.exe
          append_body: false
          generate_release_notes: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}