name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      # =========================================================
      # Checkout repository
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_TOKEN }}

      # =========================================================
      # Fetch tags
      # =========================================================
      - name: Fetch all tags
        shell: pwsh
        run: |
          git fetch --force --tags

      # =========================================================
      # Setup Python
      # =========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================================================
      # Cache pip
      # =========================================================
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      # =========================================================
      # Install dependencies
      # =========================================================
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

          pip install -r requirements.txt

          pip install pyinstaller
          pip install "python-semantic-release[github]"

      # =========================================================
      # Build executable BEFORE release
      # =========================================================
      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --clean `
            --noconfirm `
            --add-data "config;config" `
            --name rebase-overlord `
            git_feature_flow.py

      # =========================================================
      # Verify EXE exists
      # =========================================================
      - name: Verify build output
        shell: pwsh
        run: |
          Get-ChildItem dist

          if (!(Test-Path "dist/rebase-overlord.exe")) {
            Write-Error "EXE not found"
            exit 1
          }

      # =========================================================
      # Run semantic release
      # =========================================================
      - name: Run semantic release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: pwsh
        run: |
          semantic-release version

      # =========================================================
      # Upload workflow artifact
      # =========================================================
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-exe
          path: dist/rebase-overlord.exe