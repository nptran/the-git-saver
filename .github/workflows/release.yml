name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh

    steps:
      # =========================================================
      # Checkout repository
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_TOKEN }}

      # =========================================================
      # Fetch all tags
      # =========================================================
      - name: Fetch all tags
        run: git fetch --force --tags

      # =========================================================
      # Setup Python
      # =========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================================================
      # Cache pip (Windows path)
      # =========================================================
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      # =========================================================
      # Install dependencies
      # =========================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip install "python-semantic-release[github]"

      # =========================================================
      # Detect next version (machine-readable, no regex parsing)
      # =========================================================
      - name: Detect next version
        id: detect
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          $v = (semantic-release version --noop --print).Trim()

          if ($v) {
            echo "released=true" >> $env:GITHUB_OUTPUT
            echo "version=$v" >> $env:GITHUB_OUTPUT
            Write-Host "Next version: $v"
          }
          else {
            echo "released=false" >> $env:GITHUB_OUTPUT
            Write-Host "No release will be created"
          }

      # =========================================================
      # Run semantic release (bump + commit + tag + create release)
      # =========================================================
      - name: Run semantic release
        if: steps.detect.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: semantic-release version

      # =========================================================
      # Fetch tags again to sync local refs after release
      # =========================================================
      - name: Sync tags after release
        if: steps.detect.outputs.released == 'true'
        run: git fetch --force --tags

      # =========================================================
      # Verify expected tag exists AND HEAD == release commit
      # (deterministic check, no latest-tag guessing)
      # =========================================================
      - name: Verify release tag and commit
        if: steps.detect.outputs.released == 'true'
        run: |
          $v = "${{ steps.detect.outputs.version }}"

          # Verify tag exists
          git rev-parse "refs/tags/ver$v"

          # Verify HEAD is exactly the release commit
          $tagCommit  = git rev-list -n 1 "ver$v"
          $headCommit = git rev-parse HEAD

          if ($tagCommit -ne $headCommit) {
            Write-Error "HEAD mismatch with release tag — aborting build"
            exit 1
          }

          Write-Host "Verified: ver$v -> $tagCommit"

      # =========================================================
      # Build executable from verified release commit
      # =========================================================
      - name: Build executable
        if: steps.detect.outputs.released == 'true'
        run: |
          pyinstaller `
            --onefile `
            --clean `
            --noconfirm `
            --add-data "config;config" `
            --name rebase-overlord `
            git_feature_flow.py

      # =========================================================
      # Rename with actual version
      # =========================================================
      - name: Rename executable
        if: steps.detect.outputs.released == 'true'
        run: |
          $v = "${{ steps.detect.outputs.version }}"
          Rename-Item -Path "dist\rebase-overlord.exe" -NewName "rebase-overlord-$v.exe"
          Write-Host "Renamed to rebase-overlord-$v.exe"

      # =========================================================
      # Verify artifact before upload
      # =========================================================
      - name: Verify build artifact
        if: steps.detect.outputs.released == 'true'
        run: |
          $v = "${{ steps.detect.outputs.version }}"
          Get-ChildItem dist

          if (!(Test-Path "dist\rebase-overlord-$v.exe")) {
            Write-Error "Expected artifact not found: rebase-overlord-$v.exe"
            exit 1
          }

      # =========================================================
      # Upload EXE to GitHub Release
      # =========================================================
      - name: Upload EXE to GitHub Release
        if: steps.detect.outputs.released == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ver${{ steps.detect.outputs.version }}
          files: dist/rebase-overlord-${{ steps.detect.outputs.version }}.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      # =========================================================
      # Upload workflow artifact (backup, 30-day retention)
      # =========================================================
      - name: Upload workflow artifact
        if: steps.detect.outputs.released == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rebase-overlord-${{ steps.detect.outputs.version }}
          path: dist/rebase-overlord-${{ steps.detect.outputs.version }}.exe
          retention-days: 30
